<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bijtje</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffcc00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bijtje">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, calm, wordless — everything is colour, symbol and position; words only for helpers.
   IDEA: the velcro picto-board of a day centre: seven coloured day strips with symbol cards stuck on, and her own sticker on today.
   PICTURE: the week board itself; tapping a strip unrolls it into a day ribbon from sun-up to moon, with a live "now" line.
   COLOUR and TYPE: one strong colour per weekday on a white board; Andika + Baloo 2 for the few helper words.
   LAYOUT: now-strip (where am I, what now, what next) → week board → full-screen day ribbon; editor behind a long press. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a160d);--ink:light-dark(#2b2118,#fff8e6);--soft:light-dark(#fff5d6,#2a2415);--line:light-dark(#f0dfa6,#4a3f22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 Andika,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;user-select:none}
main.wrap{max-width:1280px;margin:0 auto}
.ovw{display:flex;flex-direction:column;gap:14px}
.ovd{display:grid;grid-template-columns:12px minmax(0,1fr);gap:14px;padding:14px;border:2px solid var(--line);border-radius:20px}
.ovd .bar{border-radius:6px;background:var(--c)}
.ovd h3{margin:0 0 6px;font:800 21px/1.2 'Baloo 2',sans-serif;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ovd.today{border-color:var(--ink)}
.seg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:16px}
.seg:first-of-type{border-top:0}
.seg time{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg .mini{display:inline-flex;gap:4px;vertical-align:middle;margin-inline-end:6px}
.seg .mini .tile,.seg .mini .ava{width:32px;height:32px;font-size:19px;border-radius:9px;border-width:2px;box-shadow:none}
.seg .mini .ava{border-radius:50%}.seg .mini .ob{display:none}
.msg{background:var(--soft);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.msg header{display:flex;justify-content:space-between;gap:8px;font-size:14px;opacity:.75;margin-bottom:4px;flex-wrap:wrap}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:8px;background:var(--c);color:var(--k);text-transform:capitalize;margin-inline-end:6px}
textarea{font:inherit;font-size:17px;width:100%;min-height:96px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.hnotes{margin:10px 0 40px 64px}.hnotes h4{font:800 18px 'Baloo 2';margin:0 0 8px}
.edit b{position:absolute;top:-4px;inset-inline-end:-4px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:#e53935;color:#fff;font:700 15px/26px Andika;text-align:center}
.holdbtn{position:relative;touch-action:none}
.holdbtn svg{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg;pointer-events:none}
.holdbtn circle{fill:none;stroke:var(--bg);stroke-width:5;stroke-dasharray:189;stroke-dashoffset:189}
.holdbtn.hold circle{transition:stroke-dashoffset .55s linear;stroke-dashoffset:0}
.edbtn{width:72px;height:72px;border-radius:50%;background:var(--soft);font-size:30px;display:grid;place-items:center}
.edbtn circle{stroke:var(--ink)}
.navrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.navrow .btn{min-width:52px}
button,.day,.blk,[data-day]{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.band{padding:clamp(14px,2.4vw,28px) max(3vw,12px)}
.nowwrap{display:flex;gap:12px;align-items:stretch}.nowwrap .now{flex:1}
.spk{width:110px;flex:none;border-radius:32px;background:var(--ink);color:var(--bg);font-size:56px;display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.spk.talk{background:#ffcc00;color:#2b2118}
.sheet-h .spk{width:96px;height:72px;font-size:44px;border-radius:24px;box-shadow:none}
.now{justify-content:center;display:flex;align-items:center;gap:clamp(10px,2vw,22px);background:var(--c);color:var(--k);border-radius:32px;padding:14px 22px;box-shadow:0 8px 0 rgba(0,0,0,.15);width:100%;flex-wrap:wrap}
.now .pin{font-size:44px}
.arr{font-size:40px;opacity:.8}
.nextbox{opacity:.75;display:flex;gap:10px;align-items:center}
.nextbox .tile{transform:scale(.8)}
.tile{width:92px;height:92px;flex:none;border-radius:24px;display:grid;place-items:center;font-size:56px;background:var(--pc,#fff);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),0 3px 0 rgba(0,0,0,.12);position:relative}
.ava{width:92px;height:92px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:54px;background:var(--pc,#eee);border:5px solid #fff;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ava img.sym{width:84%;height:84%;object-fit:contain;border-radius:0}
.ava i{position:absolute;inset-block-end:-6px;inset-inline-end:-8px;font-style:normal;font-size:.42em;background:#fff;border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.me{outline:6px solid #ffcc00}
.ob{position:absolute;inset-block-end:-6px;inset-inline-end:-8px;width:52%;height:52%;border-radius:50%;background:var(--oc,#fff);border:3px solid #fff;display:grid;place-items:center;font-style:normal;font-size:.5em;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.25);overflow:hidden;z-index:1}
.ob img{width:100%;height:100%;object-fit:cover}
.navr{display:flex;gap:10px;align-items:center}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.arrow{width:72px;height:72px;border-radius:50%;background:var(--soft);font-size:34px;display:grid;place-items:center}
.dots{display:flex;gap:8px}.dots span{width:16px;height:16px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--ink)}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(6px,1vw,14px);align-items:stretch}
.day{border-radius:24px;background:var(--c);color:var(--k);padding:12px 6px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:min(56vh,540px);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.day{padding-inline-start:36px!important}
.day .vname{position:absolute;inset-block:0;inset-inline-start:0;width:30px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.09);border-start-start-radius:24px;border-end-start-radius:24px;pointer-events:none}
.day .vname span{display:block;rotate:-90deg;white-space:nowrap;font:800 clamp(14px,1.5vw,18px)/1 'Baloo 2',sans-serif;letter-spacing:.06em;text-transform:capitalize}
.day .home{position:relative;width:clamp(48px,8vw,74px);height:clamp(48px,8vw,74px);border-radius:20px;display:grid;place-items:center;font-size:clamp(28px,5vw,46px);background:var(--pc);border:4px solid rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.day .cap{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:26px}
.day .stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.day .stack span{position:relative;overflow:visible!important;width:clamp(40px,7vw,62px);height:clamp(40px,7vw,62px);border-radius:16px;display:grid;place-items:center;font-size:clamp(24px,4.4vw,38px);background:var(--pc,#fff);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);overflow:hidden}
.day .stack img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.day .home.dn{opacity:.35;filter:saturate(.4)}
.day .stack .dn{opacity:.35;filter:saturate(.4)}
.day .stack .here{width:auto!important;height:auto!important;background:none!important;box-shadow:none!important;margin-block:-2px}
.day .stack .here .ava{width:clamp(36px,5vw,48px);height:clamp(36px,5vw,48px);font-size:clamp(20px,3vw,28px);border-width:3px}
.day .stack .pp{border-radius:50%;border:3px solid #fff}
.day.past{opacity:.38;filter:saturate(.5)}
.day.past::after{content:"✓";position:absolute;top:50%;inset-inline-start:calc(50% + 15px);translate:-50% -50%;width:44px;height:44px;font-size:26px!important;border-radius:50%;background:rgba(255,255,255,.9);color:#2b2118;display:grid;place-items:center;font:800 18px/1 'Baloo 2'}
.day .tm{font:700 13px/1 Andika;opacity:.85;margin-top:-4px}
.day.today{outline:7px solid var(--ink);outline-offset:4px;z-index:1}
.day .meflag{position:absolute;top:-78px;font-size:40px}
.day .meflag .ava{width:64px;height:64px;font-size:36px;border-width:4px}
.board.hasToday{margin-top:82px}
.ov{position:fixed;inset:0;background:rgba(10,8,25,.6);display:none;align-items:stretch;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;padding:0 max(3vw,14px) 60px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:3}
.close{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 34px/1 'Baloo 2'}
.dayhead{flex:1;min-height:72px;border-radius:24px;background:var(--c);color:var(--k);display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 16px;flex-wrap:wrap;text-align:center}
.dayhead b{font:800 clamp(24px,3.4vw,32px)/1 'Baloo 2',sans-serif}.dayhead span{font-size:17px;opacity:.9}
.tl{position:relative;margin:10px 0 20px 64px}
.tl .hr{position:absolute;inset-inline:-64px 0;border-top:2px dashed var(--line);font-size:14px;opacity:.7}
.tl .hr b{position:absolute;inset-inline-start:0;top:-11px;background:var(--bg);padding-inline-end:6px;font-weight:400}
.blk{position:absolute;inset-inline:0;border-radius:22px;background:var(--pc);color:#2b2118;display:block;padding:8px 14px;overflow:clip;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);text-align:start}
.blk .tile,.blk .ava{width:72px;height:72px;font-size:44px}
.blk.short .tile,.blk.short .ava{width:46px;height:46px;font-size:28px;border-width:3px}
.blk.done{opacity:.4;filter:saturate(.4)}
.blk .in{position:sticky;top:104px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.blk.done .in::after{content:"✓";margin-inline-start:auto;font:800 40px 'Baloo 2'}
.blk.cur{outline:6px solid var(--ink);z-index:2}
.blk small{font-size:15px;opacity:.75}
.endcap{position:absolute;inset-inline:0;display:flex;align-items:center;gap:12px;font-size:48px}
.endcap small{font:700 17px Andika;order:2;opacity:.7}
.endcap::after{content:"";flex:1;height:8px;border-radius:4px;background:var(--line)}
.nowline{position:absolute;inset-inline:-64px -6px;height:0;border-top:6px solid #ff3b30;z-index:4;pointer-events:none}
.nowline .ava{position:absolute;inset-inline-start:-6px;top:-38px;width:70px;height:70px;font-size:40px}
.edit{width:72px;height:72px;font-size:30px;position:relative;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.status{font-size:14px;opacity:.6;padding:0 max(3vw,12px) 80px}
.ed{user-select:text}
.ed h2{font:800 26px 'Baloo 2';margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{min-height:48px;padding:0 16px;border-radius:14px;background:var(--soft);font-weight:700}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
label.f{display:block;font-weight:700;margin:14px 0 6px;font-size:17px}
input[type=text],input[type=date],input[type=time],select{font:inherit;font-size:17px;min-height:48px;width:100%;max-width:420px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=time]{max-width:160px}
:focus-visible{outline:4px solid #ffb300;outline-offset:2px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-width:56px;min-height:56px;border-radius:16px;background:var(--soft);font-size:28px;padding:4px 10px;display:flex;align-items:center;gap:8px;border:3px solid transparent}
.pick button span{font-size:15px}
.pick button[aria-pressed=true]{border-color:var(--ink);background:light-dark(#fff3c4,#4a3f10)}
.sw{width:48px!important;min-width:48px!important;height:48px;border-radius:50%!important;background:var(--c)!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:52px;padding:0 20px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.warn{background:#c62828;color:#fff}
.card{border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:8px;margin-bottom:8px;flex-wrap:wrap}
.li .tile,.li .ava{width:52px;height:52px;font-size:30px;border-width:3px}
.li .grow{flex:1 1 160px;font-size:16px}
.toggle{display:flex;align-items:center;gap:10px;min-height:48px;font-size:17px}
.toggle input{width:26px;height:26px}
.daycols{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.daycols label{display:flex;align-items:center;gap:8px;font-size:16px;text-transform:capitalize}
.daycols input{width:52px;height:44px;border:0;background:none}
.note{font-size:15px;opacity:.75}
@media(max-width:760px){.day{min-height:440px}.board{padding-top:82px!important}.day .meflag{top:-74px!important}.nowwrap{gap:8px}.now{gap:8px;padding:10px 12px;border-radius:24px}.now .ava,.now .tile{width:58px;height:58px;font-size:32px}.now .pin{font-size:30px}.arr{font-size:28px}.spk{width:72px;font-size:36px;border-radius:24px}.hnotes{margin-inline-start:0}.ovd{padding:10px;gap:10px}.day .meflag{top:-56px}.spk{width:84px;font-size:42px}.board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:104px;overflow-x:auto;padding:46px 8px 14px;margin-top:0!important}.tile,.ava{width:70px;height:70px;font-size:40px}.now{padding:12px 14px}}
@media(prefers-reduced-motion:reduce){.holdbtn.hold circle{transition:none}}
.spk.loading{background:conic-gradient(#ffcc00 calc(var(--p,0)*1%),var(--ink) 0)}
.spk.loading::after{content:"";position:absolute}
.tile img,.home img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.q15{display:grid;grid-template-columns:repeat(4,16px);gap:6px;flex:none}
.q15 i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;opacity:.45}
.q15 i.on{background:currentColor;opacity:1}
.moons{font-size:30px;letter-spacing:2px}
body.night{--bg:#12102a;--ink:#f1eeff;--soft:#2a2415;--line:#4a3f22}
body.night .board,body.night .wk-h .arrow,body.night .dots{opacity:.4}
.day .stack .off{opacity:.5;filter:grayscale(1)}
.day .stack .off::after,.blk.off .in::after{content:"✕";color:#e53935;font:800 1.2em/1 'Baloo 2',sans-serif}
.day .stack .off::after{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6em;filter:none}
.blk.off{filter:grayscale(.9);opacity:.6;background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,0,0,.08) 14px 28px)}
.blk.off .in::after{margin-inline-start:auto;font-size:44px}
.blk.say{outline:7px solid #ffcc00;z-index:3}
.special{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff3c4;color:#2b2118;border-radius:22px;padding:10px 16px;margin:6px 0 14px;font-size:20px}
.special .big{font-size:52px;line-height:1}
.special .ava{width:64px;height:64px;font-size:36px}
.wk-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;margin-bottom:16px}
.wk-h>.navr:nth-child(2){justify-content:center;gap:16px}
.arrow,.edit{flex:none}
.day{gap:8px;padding:14px 8px 16px}
.day .tm{margin-top:0}
.day .cap{width:42px;height:42px;font-size:24px}
@media(max-width:760px){
 .band{padding-inline:12px}
 .arrow,.edit{width:56px;height:56px;font-size:26px}
 .wk-h{gap:8px;margin-bottom:8px}.wk-h>.navr:nth-child(2){gap:10px}.navr{gap:8px}
 .dots span{width:12px;height:12px}.dots{gap:6px}
 .nowwrap{align-items:stretch}.now{flex-wrap:nowrap;gap:6px;padding:10px;min-height:76px}

}

.gate{max-width:520px;margin:12vh auto;padding:24px;text-align:center;font-size:20px}
.gate .big{font-size:84px}

.gate .btn{width:100%;margin-top:8px}
.gate h2{font:800 28px 'Baloo 2',sans-serif;margin:8px 0}
.linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}

.rolechip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:10px;background:var(--line)}
.dshort,.brk{display:none}

 .now{flex-wrap:wrap!important;row-gap:8px}.brk{display:block;flex-basis:100%;height:0}
 /* whole week visible at once on a phone */
